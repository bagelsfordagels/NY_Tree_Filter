<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DB Viewer</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    #controls { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="search" placeholder="Search..." />
    <button id="reload">Reload</button>
    <label>Limit: <input id="limit" type="number" value="50" style="width:70px" /></label>
  </div>

  <div id="table-wrap"></div>

  <script>
    const apiBase = 'http://127.0.0.1:5000/api/trees';
    async function load() {
      const search = document.getElementById('search').value;
      const limit = document.getElementById('limit').value || 50;
      const params = new URLSearchParams({ limit });
      if (search) params.set('search', search);

      const res = await fetch(apiBase + '?' + params.toString());
      const rows = await res.json();
      renderTable(rows);
    }

    function renderTable(rows) {
      const wrap = document.getElementById('table-wrap');
      wrap.innerHTML = '';
      if (!rows || rows.length === 0) { wrap.textContent = 'No rows'; return; }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      Object.keys(rows[0]).forEach(k => {
        const th = document.createElement('th'); th.textContent = k; headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      rows.forEach(r => {
        const tr = document.createElement('tr');
        Object.values(r).forEach(v => {
          const td = document.createElement('td');
          td.textContent = (v === null || v === undefined) ? '' : v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }

    document.getElementById('reload').addEventListener('click', load);
    // initial load
    load();
  </script>
</body>
</html>
