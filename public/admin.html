<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>NY Tree  Filter - Admin</title>
        <link rel="stylesheet" href="css/style.css">
        <style>
            body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #acdecb;
            color: var(--text);
            line-height: 1.6;
            }
            h1{
                text-align: center;
                margin-top: 20px;
            }
            .button-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                max-width: 1200px;
                margin: 0 auto;
            }
           table{
                width: 80%;
                margin: 20px auto;
                border-collapse: collapse;
                background-color: #faf7f0;
            }
            th, td{
                border: 1px solid #000000;
                padding: 8px;
                text-align: left;
            }
            th{
                background-color: #faf7f0;
            }
            .add-btn{
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
                margin-bottom: 10px;
                border-radius: 10px;
            }
            .add-btn:hover{
                background-color: #45a049;
            }
            .edit-btn{
                padding: 5px 10px;
                background-color: #008CBA;
                color: white;
                border: none;
                cursor: pointer;
                border-radius: 10px;
            }
            .edit-btn:hover{
                background-color: #007bb5;
            }
            .delete-btn{
                padding: 5px 10px;
                background-color: #f44336;
                color: white;
                border: none;
                cursor: pointer;
                border-radius: 10px;
            }
            .delete-btn:hover{
                background-color: #da190b;
            }
            .search-btn{
                padding: 10px 20px;
                background-color: #6c757d;
                color: white;
                border: none;
                cursor: pointer;
                margin-left: 10px;
                border-radius: 10px;
            }
            .search-btn:hover{
                background-color: #5a6268;
            }
            
        </style>
    </head>

    <body>
        <h1>Manage Trees</h1>
        <div class = "button-row">
            <a href="addTree.html"><button type="button" class="add-btn">Add</button></a>
            <a href="search.html"><button type="button" class="search-btn">User View</button></a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Common Name</th>
                    <th>Species</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="treeTableBody">
            </tbody>
        </table>
        <script src="js/admin.js"></script>       
    </body>
</html>
